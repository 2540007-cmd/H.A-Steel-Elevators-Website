<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Admin — H.A Steel Elevators</title>
    <link rel="icon" href="favicon.ico">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #030712;
            color: #ffffff;
            font-family: 'Inter', system-ui, sans-serif;
            padding: 2rem 1.25rem 5rem;
        }
        .wrap { max-width: 760px; margin: 0 auto; }
        .top-bar {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 1rem;
        }
        h1 {
            font-size: 1.6rem;
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 0.5rem;
        }
        h1 span { color: #dc2626; }
        .sub { color: #9ca3af; font-size: 0.9rem; margin-bottom: 2rem; }
        .logout-btn {
            background: transparent;
            border: 1px solid #374151;
            color: #9ca3af;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }
        .logout-btn:hover { border-color: #dc2626; color: #fff; }

        .card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .card h2 {
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #dc2626;
            margin-bottom: 1rem;
            font-weight: 600;
        }
        label {
            display: block;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #9ca3af;
            margin: 1rem 0 0.35rem;
        }
        label:first-of-type { margin-top: 0; }
        input, select, textarea {
            width: 100%;
            background: #030712;
            border: 1px solid #374151;
            color: #fff;
            padding: 0.6rem 0.75rem;
            border-radius: 4px;
            font-family: inherit;
            font-size: 0.9rem;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #dc2626;
        }
        textarea { resize: vertical; min-height: 70px; }
        .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

        /* ---------- Dropzone ---------- */
        .dropzone {
            border: 2px dashed #374151;
            border-radius: 8px;
            padding: 1.75rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s;
        }
        .dropzone:hover { border-color: #6b7280; }
        .dropzone.dragover {
            border-color: #dc2626;
            background: rgba(220, 38, 38, 0.06);
        }
        .dropzone p {
            font-size: 0.85rem;
            color: #d1d5db;
            margin-bottom: 0.25rem;
        }
        .dropzone .hint {
            font-size: 0.72rem;
            color: #6b7280;
        }

        .preview-grid {
            margin-top: 0.85rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 0.6rem;
        }
        .preview-item {
            position: relative;
            aspect-ratio: 1;
            border-radius: 6px;
            overflow: hidden;
            background: #030712;
            border: 1px solid #1f2937;
        }
        .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .preview-item .remove-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: rgba(0,0,0,0.7);
            border: none;
            color: #fff;
            font-size: 0.7rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .preview-item .remove-btn:hover { background: #dc2626; }
        .preview-item .badge {
            position: absolute;
            bottom: 4px;
            left: 4px;
            font-size: 0.6rem;
            padding: 0.1rem 0.4rem;
            border-radius: 3px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .preview-item .badge.converting { background: rgba(234,179,8,0.85); color: #000; }
        .preview-item .badge.error { background: rgba(220,38,38,0.9); color: #fff; }
        .preview-loading, .preview-error {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            color: #9ca3af;
            text-align: center;
            padding: 0.5rem;
        }

        button.primary {
            width: 100%;
            margin-top: 1.5rem;
            background: #dc2626;
            border: none;
            color: #fff;
            padding: 0.75rem;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
        }
        button.primary:hover { background: #b91c1c; }
        button.primary:disabled { background: #374151; cursor: not-allowed; }

        .status {
            margin-top: 0.85rem;
            font-size: 0.82rem;
            padding: 0.6rem 0.75rem;
            border-radius: 4px;
            display: none;
        }
        .status.show { display: block; }
        .status.ok { background: rgba(22,163,74,0.15); color: #4ade80; border: 1px solid rgba(74,222,128,0.3); }
        .status.err { background: rgba(220,38,38,0.15); color: #f87171; border: 1px solid rgba(248,113,113,0.3); }

        .existing-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 0.75rem 0;
            border-bottom: 1px solid #1f2937;
        }
        .existing-item:last-child { border-bottom: none; }
        .existing-item .meta { font-size: 0.85rem; }
        .existing-item .meta strong { display: block; }
        .existing-item .meta span { color: #9ca3af; font-size: 0.78rem; }
        .existing-item button {
            background: transparent; border: 1px solid #374151; color: #f87171;
            padding: 0.35rem 0.75rem; border-radius: 4px; cursor: pointer; font-size: 0.75rem;
        }
        .existing-item button:hover { border-color: #dc2626; }
    </style>
</head>

<body>
    <div class="wrap">

        <div class="top-bar">
            <div>
                <h1>PROJECTS <span>ADMIN</span></h1>
                <p class="sub">Add or remove projects shown on the public Projects page. Changes appear immediately — no deploy needed.</p>
            </div>
            <button class="logout-btn" onclick="logout()">Log Out</button>
        </div>

        <div class="card">
            <h2>Add New Project</h2>

            <label>Title</label>
            <input id="f_title" placeholder="e.g. Multi-Story Cargo Elevator" />

            <div class="row2">
                <div>
                    <label>Category</label>
                    <select id="f_category">
                        <option>Elevators</option>
                        <option>Crane</option>
                        <option>Shed</option>
                        <option>Warehouse</option>
                        <option>Others</option>
                    </select>
                </div>
                <div>
                    <label>Type Label</label>
                    <input id="f_typeLabel" placeholder="e.g. Cargo Elevator" />
                </div>
            </div>

            <div class="row2">
                <div>
                    <label>Company</label>
                    <input id="f_company" placeholder="Client name" />
                </div>
                <div>
                    <label>Year</label>
                    <input id="f_year" type="number" placeholder="2026" />
                </div>
            </div>

            <label>Location</label>
            <input id="f_location" placeholder="City, Country" />

            <label>Scope of Work (one line per bullet)</label>
            <textarea id="f_scope" placeholder="Fabrication&#10;Installation&#10;Testing"></textarea>

            <label>Description</label>
            <textarea id="f_description" placeholder="Full project description..."></textarea>

            <label>Project Images</label>
            <div class="dropzone" id="dropzone">
                <input type="file" id="fileInput" accept="image/*" multiple hidden>
                <p>Drag &amp; drop images here, or click to browse</p>
                <p class="hint">PNG, JPG, or WEBP — auto-converted to WebP on upload</p>
            </div>
            <div class="preview-grid" id="previewGrid"></div>

            <button class="primary" id="submitBtn" onclick="addProject()">Add Project</button>
            <div id="addStatus" class="status"></div>
        </div>

        <div class="card">
            <h2>Existing Projects</h2>
            <div id="existingList"></div>
        </div>
    </div>

    <script>
        /* ============================================================
           IMAGE HANDLING — drag & drop, WebP conversion, previews
           ============================================================ */

        let pendingImages = []; // { id, file, blob, type, status, previewUrl, errorMsg }

        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');
        const previewGrid = document.getElementById('previewGrid');

        dropzone.addEventListener('click', () => fileInput.click());

        dropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropzone.classList.add('dragover');
        });
        dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
            fileInput.value = ''; // allow re-selecting the same file later
        });

        function handleFiles(fileList) {
            Array.from(fileList).forEach((file) => {
                if (!file.type.startsWith('image/')) return;

                const item = { id: crypto.randomUUID(), file, status: 'converting' };
                pendingImages.push(item);
                renderPreviews();

                convertToWebP(file).then((result) => {
                    if (!result.success) {
                        item.status = 'error';
                        item.errorMsg = result.errorMsg;
                        renderPreviews();
                        return;
                    }
                    item.blob = result.blob;
                    item.type = result.blob.type;
                    item.status = 'ready';
                    item.previewUrl = URL.createObjectURL(item.blob);
                    renderPreviews();
                });
            });
        }

        // Draws the image onto a canvas (downscaled if huge) and exports as
        // WebP. If this browser can't produce a real WebP blob via canvas,
        // this fails outright rather than silently falling back to a
        // heavier format — keeping page-weight predictable matters more
        // here than accepting every possible browser.
        function convertToWebP(file, maxDim = 1920, quality = 0.82) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    let { width, height } = img;
                    if (width > maxDim || height > maxDim) {
                        const scale = maxDim / Math.max(width, height);
                        width = Math.round(width * scale);
                        height = Math.round(height * scale);
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    canvas.getContext('2d').drawImage(img, 0, 0, width, height);

                    canvas.toBlob((blob) => {
                        if (blob && blob.type === 'image/webp') {
                            resolve({ success: true, blob });
                        } else {
                            resolve({
                                success: false,
                                errorMsg: "This browser can't export WebP. Try Chrome, Edge, or Firefox.",
                            });
                        }
                    }, 'image/webp', quality);
                };
                img.onerror = () => resolve({ success: false, errorMsg: 'Could not read this file as an image.' });
                img.src = URL.createObjectURL(file);
            });
        }

        function removeImage(id) {
            pendingImages = pendingImages.filter((i) => i.id !== id);
            renderPreviews();
        }

        function renderPreviews() {
            previewGrid.innerHTML = '';
            pendingImages.forEach((item) => {
                const div = document.createElement('div');
                div.className = 'preview-item';

                if (item.status === 'converting') {
                    div.innerHTML = `<div class="preview-loading">Converting…</div>`;
                } else if (item.status === 'error') {
                    div.innerHTML = `
                        <div class="preview-error">${item.errorMsg}</div>
                        <span class="badge error">Failed</span>
                        <button type="button" class="remove-btn" onclick="removeImage('${item.id}')">✕</button>
                    `;
                } else {
                    div.innerHTML = `
                        <img src="${item.previewUrl}">
                        <button type="button" class="remove-btn" onclick="removeImage('${item.id}')">✕</button>
                    `;
                }
                previewGrid.appendChild(div);
            });
        }

        async function uploadPendingImages() {
            const urls = [];
            for (const item of pendingImages) {
                if (item.status !== 'ready') continue;
                const res = await fetch('/api/upload-image', {
                    method: 'POST',
                    headers: { 'Content-Type': item.blob.type || 'application/octet-stream' },
                    body: item.blob,
                });
                if (!res.ok) throw new Error('Image upload failed: ' + (await res.text()));
                const data = await res.json();
                urls.push(data.url);
            }
            return urls;
        }

        /* ============================================================
           PROJECT FORM
           ============================================================ */

        function showStatus(el, ok, msg) {
            el.textContent = msg;
            el.className = 'status show ' + (ok ? 'ok' : 'err');
        }

        async function addProject() {
            const scopeLines = document.getElementById('f_scope').value
                .split('\n').map(s => s.trim()).filter(Boolean);
            const scopeHtml = scopeLines.map(s => `• ${s}<br>`).join('');

            const titleVal = document.getElementById('f_title').value.trim();
            const companyVal = document.getElementById('f_company').value.trim();
            const yearVal = document.getElementById('f_year').value;

            if (!titleVal || !companyVal || !yearVal) {
                showStatus(document.getElementById('addStatus'), false, 'Title, company, and year are required.');
                return;
            }

            if (pendingImages.some(i => i.status === 'error')) {
                showStatus(document.getElementById('addStatus'), false, 'Remove the failed image(s) before adding this project.');
                return;
            }

            if (pendingImages.some(i => i.status === 'converting')) {
                showStatus(document.getElementById('addStatus'), false, 'Still converting images — try again in a moment.');
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;

            try {
                btn.textContent = 'Uploading images...';
                const imageUrls = await uploadPendingImages();

                btn.textContent = 'Adding...';
                const payload = {
                    title: titleVal,
                    category: document.getElementById('f_category').value,
                    typeLabel: document.getElementById('f_typeLabel').value.trim(),
                    company: companyVal,
                    location: document.getElementById('f_location').value.trim(),
                    year: yearVal,
                    scope: scopeHtml,
                    description: document.getElementById('f_description').value.trim(),
                    images: imageUrls,
                };

                const res = await fetch('/api/projects', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });

                if (res.status === 401) {
                    showStatus(document.getElementById('addStatus'), false, 'Session expired — please log in again.');
                    setTimeout(() => window.location.href = '/login', 1500);
                } else if (!res.ok) {
                    showStatus(document.getElementById('addStatus'), false, 'Error: ' + (await res.text()));
                } else {
                    showStatus(document.getElementById('addStatus'), true, 'Project added — check the live Projects page.');
                    document.querySelectorAll('.card input, .card textarea').forEach(i => i.value = '');
                    document.getElementById('f_category').selectedIndex = 0;
                    pendingImages = [];
                    renderPreviews();
                    loadExisting();
                }
            } catch (err) {
                showStatus(document.getElementById('addStatus'), false, 'Error: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Add Project';
            }
        }

        async function loadExisting() {
            const list = document.getElementById('existingList');
            list.innerHTML = 'Loading…';
            try {
                const res = await fetch('/api/projects', { cache: 'no-store' });
                const projects = await res.json();
                if (!projects.length) {
                    list.innerHTML = '<p style="color:#9ca3af;font-size:0.85rem;">No projects yet.</p>';
                    return;
                }
                list.innerHTML = '';
                projects.forEach(p => {
                    const row = document.createElement('div');
                    row.className = 'existing-item';
                    row.innerHTML = `
                        <div class="meta">
                            <strong>${p.title}</strong>
                            <span>${p.company} — ${p.location} (${p.year})</span>
                        </div>
                        <button onclick="deleteProject('${p.id}')">Delete</button>
                    `;
                    list.appendChild(row);
                });
            } catch (err) {
                list.innerHTML = '<p style="color:#f87171;font-size:0.85rem;">Failed to load projects.</p>';
            }
        }

        async function deleteProject(id) {
            if (!confirm('Delete this project? This cannot be undone.')) return;
            try {
                const res = await fetch(`/api/projects/${id}`, { method: 'DELETE' });
                if (res.status === 401) {
                    alert('Session expired — please log in again.');
                    window.location.href = '/login';
                } else if (!res.ok) {
                    alert('Error deleting: ' + (await res.text()));
                } else {
                    loadExisting();
                }
            } catch (err) {
                alert('Network error: ' + err.message);
            }
        }

        async function logout() {
            await fetch('/api/logout', { method: 'POST' });
            window.location.href = '/login';
        }

        loadExisting();
    </script>
</body>

</html>
